[project]
name = "workout-audio-coach"
version = "0.3.0"
description = "Generate guided workout audio files with previewable sets, reps, and rest cues."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "gtts>=2.5.4",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
workout-audio-coach = "workout_audio_coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workout_audio_coach"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["gtts", "gtts.*", "edge_tts", "edge_tts.*"]
ignore_missing_imports = true
